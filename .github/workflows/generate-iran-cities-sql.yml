name: Generate Iran Cities SQL

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout generator branch
        uses: actions/checkout@v4
        with:
          ref: generated/iran-cities-sql

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate offline SQL
        run: |
          sed -i 's/EXPECTED_FEATURES = 432/EXPECTED_FEATURES = 429/' tools/generate_iran_cities_sql.py
          python tools/generate_iran_cities_sql.py

      - name: Verify output
        run: |
          test -s artifacts/Insert_Iran_Cities_Offline.sql
          test -s artifacts/Insert_Iran_Cities_Offline.zip
          grep -q "Embedded records: 429" artifacts/Insert_Iran_Cities_Offline.sql

      - name: Upload SQL artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iran-cities-offline-sql
          path: |
            artifacts/Insert_Iran_Cities_Offline.sql
            artifacts/Insert_Iran_Cities_Offline.zip
          if-no-files-found: error
          retention-days: 7

      - name: Commit generated files to generator branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/Insert_Iran_Cities_Offline.sql artifacts/Insert_Iran_Cities_Offline.zip
          git diff --cached --quiet || git commit -m "Generate offline Iran cities SQL"
          git push origin HEAD:generated/iran-cities-sql
