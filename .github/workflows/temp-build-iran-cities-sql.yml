name: Temp Build Iran Cities SQL

on:
  push:
    branches: [master]
    paths:
      - tools/temp_generate_iran_cities_sql.py
      - .github/workflows/temp-build-iran-cities-sql.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate SQL
        run: python tools/temp_generate_iran_cities_sql.py
      - name: Verify
        run: |
          test -s artifacts/Insert_Iran_Cities_Offline.sql
          grep -q "Embedded records: 432" artifacts/Insert_Iran_Cities_Offline.sql
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/Insert_Iran_Cities_Offline.sql artifacts/Insert_Iran_Cities_Offline.zip
          git diff --cached --quiet || git commit -m "Generate offline Iran cities SQL"
          git push
