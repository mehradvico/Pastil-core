name: Temporary Generate Iran Cities SQL

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/temp-generate-iran-cities-sql.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout generator branch
        uses: actions/checkout@v4
        with:
          ref: generated/iran-cities-sql

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate and verify offline SQL
        run: |
          python tools/generate_iran_cities_sql.py
          test -s artifacts/Insert_Iran_Cities_Offline.sql
          test -s artifacts/Insert_Iran_Cities_Offline.zip
          grep -q "Embedded records: 432" artifacts/Insert_Iran_Cities_Offline.sql

      - name: Commit generated files to generator branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/Insert_Iran_Cities_Offline.sql artifacts/Insert_Iran_Cities_Offline.zip
          git diff --cached --quiet || git commit -m "Generate offline Iran cities SQL"
          git push origin HEAD:generated/iran-cities-sql
