services:
  pastil-api:
    build:
      context: .
      dockerfile: Api/Dockerfile
    ports:
      - "5000:8080"
    env_file:
      - .env
    # ساعت دیواری ایران: کد از DateTime.Now استفاده می‌کند و وب‌اپ/اپ‌ها زمان‌ها را به وقت تهران می‌فرستند و نشان می‌دهند. بدون این، کانتینر UTC است و همه‌ی ساعت‌ها ۳:۳۰ جابه‌جا می‌شوند.
    environment:
      TZ: Asia/Tehran
    depends_on:
      - pastil-file
      - pastil-payment

  pastil-file:
    build:
      context: .
      dockerfile: File/Dockerfile
    environment:
      TZ: Asia/Tehran
    ports:
      - "5001:8081"

  pastil-payment:
    build:
      context: .
      dockerfile: Payment/Dockerfile
    environment:
      TZ: Asia/Tehran
    ports:
      - "5002:8082"
